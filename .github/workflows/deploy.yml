name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - feature/spec-implementation-phase1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          if [ -d ./dist ]; then
            echo "dist exists"
          else
            if [ -d ./public ]; then
              echo "No dist. Copying public -> dist"
              rm -rf dist
              cp -r public dist
            elif [ -f ./index.html ]; then
              echo "No dist or public, using root index.html"
              rm -rf dist
              mkdir -p dist
              cp index.html dist/
              cp -r assets dist/ 2>/dev/null || true
            else
              echo "No build output found (dist/public/index.html). Listing files:"
              ls -la
              exit 1
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4