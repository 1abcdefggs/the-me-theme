<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Engine Render Benchmark — Mod32 / Power-of-2 Alpha</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:18px}
    canvas{border:1px solid #ccc;display:block;margin-bottom:12px}
    .btn{padding:8px 12px;margin-right:8px}
  </style>
</head>
<body>
  <h1>Engine Render Benchmark — Mod32 / Power-of-2 Alpha</h1>
  <p>Measures Canvas2D overlay blend cost for Mod-32-aligned colors + power-of-two alpha vs arbitrary colors/alpha.</p>
  <canvas id="c" width="800" height="600"></canvas>
  <div>
    <button class="btn" id="runBtn">Run Local Test</button>
    <span id="out"></span>
  </div>

  <script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const out = document.getElementById('out');

  // Draw loop that forces the engine to composite via repeated full-rect overlays
  function runEngineTest(mode, iterations = 400) {
    // mode: 'mod32_pow2' or 'arbitrary'
    const w = canvas.width, h = canvas.height;
    // seed random for repeatability
    let rseed = 12345;
    function rnd() { rseed = (1103515245 * rseed + 12345) & 0x7fffffff; return rseed / 0x7fffffff; }

    ctx.clearRect(0,0,w,h);
    const start = performance.now();
    for (let i=0;i<iterations;i++) {
      let r,g,b,a;
      if (mode === 'mod32_pow2') {
        // components on mod32 boundary: 0,32,...224
        const k = Math.floor(rnd()*8);
        r = k*32;
        g = Math.floor(rnd()*8)*32;
        b = Math.floor(rnd()*8)*32;
        // power-of-two alpha: choose 0.5 or 0.25 alternating
        a = (i%2===0) ? 0.5 : 0.25;
      } else {
        r = Math.floor(rnd()*256);
        g = Math.floor(rnd()*256);
        b = Math.floor(rnd()*256);
        // arbitrary alpha near but not power-of-two
        a = 0.501 + (rnd()*0.1);
      }

      // Use fillStyle + globalAlpha to trigger blend path
      ctx.globalAlpha = 1.0; // keep fillStyle alpha neutral
      ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
      ctx.fillRect(0,0,w,h);
    }
    // ensure raster/composite finishes by reading a tiny pixel
    try { ctx.getImageData(0,0,1,1); } catch(e) {}
    const end = performance.now();
    return end - start;
  }

  async function runBothAndReport() {
    // run sequentially to avoid saturating CPU and get stable timings
    const iters = 400;
    const t1 = runEngineTest('mod32_pow2', iters);
    // small pause to let event loop breathe
    await new Promise(r => setTimeout(r, 50));
    const t2 = runEngineTest('arbitrary', iters);

    // post results back to parent (for orchestration)
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'benchmark-result', name: 'engine-mod32', time: t1 }, '*');
      window.parent.postMessage({ type: 'benchmark-result', name: 'engine-arbitrary', time: t2 }, '*');
    }
    return { mod32: t1, arbitrary: t2 };
  }

  document.getElementById('runBtn').addEventListener('click', async () => {
    out.innerText = 'Running...';
    const res = await runBothAndReport();
    out.innerText = `mod32_pow2: ${res.mod32.toFixed(2)} ms, arbitrary: ${res.arbitrary.toFixed(2)} ms`;
  });

  // Listen for parent orchestration
  window.addEventListener('message', async (e) => {
    if (!e.data) return;
    if (e.data.type === 'run-isolated') {
      const res = await runBothAndReport();
      // also set local display
      out.innerText = `mod32_pow2: ${res.mod32.toFixed(2)} ms, arbitrary: ${res.arbitrary.toFixed(2)} ms`;
    }
  });
  </script>
</body>
</html>
