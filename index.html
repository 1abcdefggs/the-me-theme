<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheMeTheme - VS Code Visual Theme Editor</title>
  <link rel="stylesheet" href="src/ui/styles/the-me-theme-front.css">
<link rel="stylesheet" href="src/object-body/vscode-mock.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vscode/codicons@0.0.36/dist/codicon.css">

  <!-- Component Modules -->
  <script type="module" src="src/ui/components/the-me-theme-left-panel.js"></script>
  <script type="module" src="src/ui/components/the-me-theme-header.js"></script>
  <script type="module" src="src/object-body/vscode-object-body.js"></script>
  <script type="module" src="src/ui/components/the-me-theme-right-panel.js"></script>
  <script type="module" src="src/ui/components/the-me-theme-modals.js"></script>

  <!-- Monaco Editor -->
  <script>var require = { paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } };</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.nls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.js"></script>
  <script>
    window.MonacoEnvironment = {
      getWorkerUrl: function (workerId, label) {
        if (label === 'json') {
          return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(`
            self.MonacoEnvironment = { baseUrl: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/' };
            importScripts('https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/language/json/jsonWorker.js');
          `);
        }
        return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(`
          self.MonacoEnvironment = { baseUrl: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/' };
          importScripts('https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/base/worker/workerMain.js');
        `);
      }
    };
  </script>
</head>

<body>
  <!-- TheMe App Layout -->
  <div class="theme-app-layout"
    style="display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #000;">

    <!-- TheMe Top Bar (App Level) -->
    <the-me-theme-header></the-me-theme-header>

    <!-- Main Content Area -->
    <div style="display: flex; flex: 1; overflow: hidden;">
      <the-me-theme-left-panel></the-me-theme-left-panel>
      <vscode-object-body></vscode-object-body>
      <the-me-theme-right-panel></the-me-theme-right-panel>
    </div>
  </div>

  <!-- Dialogs, Popovers & Modals -->
  <the-me-theme-modals></the-me-theme-modals>

  <script type="module" src="src/ui/main.ts"></script>
</body>

</html>
